<style>
:root{--ink:#16202c;--ink2:#233144;--paper:#fff;--tint:#eef2f6;--line:#dce3eb;--muted:#5a6a7c;--red:#d94f3d;--teal:#2e8f8a;--amber:#e8a33d;--ok:#1f7a5c;--bad:#b23b2c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tint);color:var(--ink);font:17px/1.55 Calibri,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0 0 .9em}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 14px}
.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.dark .muted{color:#cfd8e3}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red);margin:0 0 .5em}
.dark .kicker{color:var(--amber)}
.muted{color:var(--muted)}.small{font-size:.9rem}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin:0 0 10px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn:focus-visible,.go:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.btn .t{display:inline-block;float:right;margin-left:10px;font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.btn[aria-pressed="true"] .t{color:var(--amber)}
.btn.sem{border-style:dashed}
.go{font:inherit;font-weight:700;color:#fff;background:var(--red);border:0;border-radius:10px;padding:14px 20px;cursor:pointer;width:100%}
.go[disabled]{background:#b9c3ce;cursor:not-allowed}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .clock{font:700 1.15rem/1 Cambria,Georgia,serif;white-space:nowrap}
.bar .lbl{font-size:.78rem;color:#cfd8e3;white-space:nowrap}
.track{flex:1;height:10px;background:#3a4c63;border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--teal);width:0;transition:width .3s}
.fill.over{background:var(--red)}
.mat{border-left:0;background:var(--tint);border-radius:10px;padding:14px;margin:0 0 12px}
.mat h3{margin-bottom:.4em}
.mat p{margin:0 0 .55em}
.mat .n{font-weight:700;color:var(--muted);font-size:.8rem;margin-right:.3em}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--tint);color:var(--ink2);margin:0 6px 6px 0}
.grid8{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.grid8 div{background:var(--tint);border-radius:8px;padding:8px 10px;font-size:.9rem}
.grid8 b{color:var(--red);margin-right:.35em}
.fvi{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.fvi button{flex:1;min-width:92px;margin:0;text-align:center}
.nota{font:700 3.4rem/1 Cambria,Georgia,serif;color:var(--amber)}
.linha{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.linha b{white-space:nowrap}
.dev{border-radius:10px;padding:12px 14px;margin:0 0 10px;background:var(--tint)}
.dev.ok{background:#e6f3ee}.dev.meio{background:#fdf3df}.dev.no{background:#fbe9e6}
.dev strong{display:block;margin-bottom:.2em}
details{margin:0 0 12px}summary{cursor:pointer;font-weight:700}
@media (max-width:480px){h1{font-size:1.6rem}.grid8{grid-template-columns:1fr}.btn .t{float:none;display:block;margin:4px 0 0}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

var CASOS=[
{id:"escola-base",nome:"Escola Base × a merenda de Santa Rita do Vale",
 hist:{nome:"o caso Escola Base",ajuda:"São Paulo, 1994. A partir de uma denúncia e das declarações de um delegado, jornais e TVs trataram os donos de uma escola infantil como culpados de abuso sexual. O inquérito foi arquivado por falta de provas. A escola já tinha sido depredada e fechada.",q:"Que fundamento o caso Escola Base feriu de forma exemplar?",princ:3,viz:[0],
  ok:"Fundamento 4. A Escola Base é o caso-escola do julgamento prévio: pessoas tratadas como culpadas antes de qualquer prova.",
  vz:"Defensável, mas é o fundamento vizinho. Houve falha de apuração (fonte única, sem checagem), só que a ferida exemplar do caso é o dano a pessoas tratadas como culpadas: fundamento 4.",
  no:"A banca esperava o fundamento 4, ética e limites: julgamento prévio e dano moral. A falha de apuração, fundamento 1, seria a segunda resposta aceitável."},
 intro:"Um vereador protocolou no Ministério Público uma denúncia sobre a compra da merenda escolar de Santa Rita do Vale. Dois veículos da região publicaram no mesmo dia.",
 A:{v:"Gazeta do Vale",t:"Prefeitura superfaturou merenda escolar em R$ 2 milhões",p:[
  "A Prefeitura de Santa Rita do Vale superfaturou em R$ 2 milhões a compra da merenda escolar deste ano.",
  "A informação consta de denúncia protocolada ontem no Ministério Público pelo vereador Dário Lemos (oposição).",
  "Segundo ele, o quilo do frango foi pago a R$ 19,80, “o dobro do preço de mercado”.",
  "O caso expõe o descaso da gestão com as crianças da rede municipal.",
  "A secretária de Educação, Lúcia Paiva, apontada como responsável pelo esquema, não foi localizada até o fechamento desta edição.",
  "A rede municipal atende 14 mil alunos."]},
 B:{v:"Portal Serra Notícias",t:"MP recebe denúncia de sobrepreço na merenda; prefeitura contesta o cálculo",p:[
  "O Ministério Público recebeu ontem uma denúncia de sobrepreço de R$ 2 milhões na compra da merenda escolar de Santa Rita do Vale, protocolada pelo vereador Dário Lemos (oposição).",
  "A reportagem teve acesso à ata do pregão nº 14 e a três notas fiscais: o quilo do frango foi contratado a R$ 19,80.",
  "No mesmo mês, a tabela de preços de referência do governo estadual indicava R$ 12,40 para o mesmo produto.",
  "Em nota, a Secretaria de Educação afirma que o preço inclui entrega diária nas 42 escolas e que a comparação “ignora o frete”.",
  "Para o economista Caio Brandão, da universidade regional, a diferença “é alta demais para ser explicada só pelo frete”.",
  "O MP informou que vai analisar a denúncia em até 30 dias. Ainda não há investigação aberta, e a reportagem não conseguiu confirmar o valor total de R$ 2 milhões, que é uma estimativa do vereador."]},
 rodadas:[
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo apurou melhor?",v:"B",ok:"b2",meio:"b3",ev:["b2","b3","b5","a6"],
   bom:"A ata do pregão e as notas fiscais são o que separa apurar de repassar. O Portal foi ao documento; a Gazeta ficou na denúncia.",pq:"A prova do fundamento 1 está em como o veículo chegou ao dado: “teve acesso à ata do pregão e a três notas fiscais”."},
  {f:3,q:"Fundamento 4, ética e limites. Qual veículo feriu o fundamento de forma mais clara?",v:"A",ok:"ta",ev:["ta","a3","a6","b4"],
   bom:"O título afirma como fato o que é uma denúncia ainda não analisada. É julgamento prévio na parte mais lida da matéria.",pq:"O trecho que prova a ferida é o título da Gazeta: “Prefeitura superfaturou”. A fala do vereador está atribuída corretamente, e os outros trechos não tratam da dignidade de ninguém."},
  {f:6,q:"Fundamento 7, transparência e prestação de contas. Qual veículo foi mais transparente com o leitor?",v:"B",ok:"b6",meio:"b2",ev:["b6","b2","b4","a2"],
   bom:"O Portal diz o que não conseguiu confirmar e de quem é a estimativa. Dizer o que ainda não se sabe é prestar contas.",pq:"A prova mais forte é o parágrafo final do Portal, que admite o que não confirmou. Explicar como soube do preço também é transparência, mas vale menos aqui."}],
 fvi:[{tx:"“O quilo do frango foi contratado a R$ 19,80”, conforme a ata do pregão e três notas fiscais.",c:"fato"},
  {tx:"“O preço inclui entrega diária nas 42 escolas”, segundo nota da Secretaria de Educação.",c:"versao"},
  {tx:"“A diferença é alta demais para ser explicada só pelo frete”, na avaliação do economista.",c:"interp"}],
 fviFb:"O preço na ata é fato: confere-se em documento. A explicação do frete é versão: relato de um envolvido. A avaliação do economista é interpretação: leitura do que o fato significa.",
 dif:[{k:"bom1",tx:"O título da Gazeta afirma o superfaturamento; o do Portal atribui a denúncia e registra a contestação."},
  {k:"x1",tx:"O texto do Portal é mais longo que o da Gazeta."},
  {k:"bom2",tx:"O Portal publica a resposta da Secretaria; a Gazeta diz que não localizou a secretária e a chama de responsável."},
  {k:"x2",tx:"A Gazeta informa quantos alunos a rede tem; o Portal não."},
  {k:"x3",tx:"Os dois citam o mesmo vereador como autor da denúncia."}],
 difNo:"Tamanho do texto, número de alunos e o fato de os dois citarem o mesmo vereador não mudam a leitura. O que muda é o verbo do título e quem foi ouvido.",
 reflexo:{mec:"A Gazeta repete o mecanismo da Escola Base: uma fonte acusadora vira título afirmativo antes de qualquer apuração. O Portal mostra a lição aplicada: atribui, confere em documento, ouve o acusado e diz o que não sabe.",
  tema:"Os dois casos envolvem escolas e crianças, o que mostra que o tema continua atual trinta anos depois.",
  moral:"Os dois casos provam que a imprensa precisa ter mais ética e mais responsabilidade com o que publica.",
  fb:"É o encontro dos dois atos: o mesmo mecanismo, fonte acusadora que vira título afirmativo, aparece nos dois casos, e uma das coberturas mostra a lição aprendida."},
 perg:{q:"Um colega levanta a mão: “E se a denúncia do vereador for verdadeira? A Gazeta não terá acertado?”",
  certo:"Acertar o fato não corrige o método. A Gazeta afirmou o que não tinha como saber naquele dia; se der certo, terá sido sorte, não apuração.",
  e1:"Sim. Se a investigação confirmar, a Gazeta estava certa desde o início e deu o furo.",
  e2:"Ainda não dá para saber, então por enquanto as duas coberturas se equivalem.",
  ok:"Estar certo não é estar justificado. O fundamento 1 trata do método de verificação, não do resultado.",
  no:"A resposta que a banca esperava separa resultado de método: mesmo que a denúncia se confirme, a Gazeta afirmou o que não tinha como saber naquele dia. E as duas coberturas não se equivalem: uma atribui e confere, a outra afirma."}},

{id:"watergate",nome:"Watergate × o contrato do lixo de Porto das Pedras",
 hist:{nome:"o caso Watergate",ajuda:"Washington, 1972. Dois repórteres do Washington Post seguiram por dois anos a pista de um arrombamento na sede do Partido Democrata, contra desmentidos seguidos da Casa Branca. A apuração expôs o envolvimento do governo, e o presidente Richard Nixon renunciou em 1974.",q:"Que fundamento o caso Watergate consagrou de forma exemplar?",princ:5,viz:[2,4],
  ok:"Fundamento 6. Watergate é o caso-escola da investigação que traz à luz o que o poder queria oculto.",
  vz:"Defensável, mas é o fundamento vizinho. O jornal resistiu à pressão do governo, e isso é verdade; só que a lição exemplar do caso é a investigação que expõe abuso de poder: fundamento 6.",
  no:"A banca esperava o fundamento 6, jornalismo investigativo. Independência editorial (3) e liberdade de imprensa (5) seriam respostas vizinhas aceitáveis."},
 intro:"A Prefeitura de Porto das Pedras trocou a empresa que faz a coleta de lixo da cidade. Dois veículos locais publicaram sobre o novo contrato na mesma semana.",
 A:{v:"Diário do Porto",t:"Nova empresa de coleta vai economizar R$ 6 milhões, anuncia prefeitura",p:[
  "A troca da empresa de coleta de lixo vai gerar economia de R$ 6 milhões por ano aos cofres de Porto das Pedras, informou ontem a prefeitura.",
  "O contrato com a Limpa Mais foi assinado na segunda-feira, em cerimônia no gabinete do prefeito Júlio Sarmento.",
  "“É o contrato mais vantajoso da história da cidade”, disse o prefeito.",
  "Para o consultor em gestão pública Ivo Tavares, a troca “mostra uma administração moderna”.",
  "O Diário do Porto é parceiro da campanha municipal Cidade Limpa.",
  "A cidade produz 180 toneladas de lixo por dia."]},
 B:{v:"Folha da Baía",t:"Contrato do lixo foi assinado sem licitação com empresa aberta há quatro meses",p:[
  "A Prefeitura de Porto das Pedras contratou sem licitação a Limpa Mais, empresa aberta há quatro meses, para a coleta de lixo da cidade.",
  "A reportagem obteve o contrato pela Lei de Acesso à Informação e consultou o registro da empresa na Junta Comercial.",
  "O documento prevê pagamento de R$ 31 milhões por ano; o contrato anterior custava R$ 29 milhões, segundo o Portal da Transparência.",
  "A prefeitura afirma que a dispensa de licitação se justifica pela “situação de emergência” e que a economia virá “a partir do segundo ano”.",
  "Um dos sócios da Limpa Mais doou para a campanha do prefeito em 2024, conforme a prestação de contas entregue à Justiça Eleitoral.",
  "Procurado, o sócio não respondeu. A reportagem não encontrou indício de que a doação tenha influenciado a escolha da empresa."]},
 rodadas:[
  {f:5,q:"Fundamento 6, jornalismo investigativo. Qual veículo foi além do que lhe entregaram?",v:"B",ok:"b2",meio:"b5",ev:["b2","b5","b4","a2"],
   bom:"Pedir o contrato pela Lei de Acesso e consultar a Junta Comercial é apuração própria. O Diário trabalhou só com o que a prefeitura anunciou.",pq:"A prova do fundamento 6 está no caminho da apuração: “obteve o contrato pela Lei de Acesso à Informação e consultou o registro da empresa”."},
  {f:2,q:"Fundamento 3, independência editorial. Qual veículo mostra menos autonomia em relação à prefeitura?",v:"A",ok:"a5",meio:"a1",ev:["a5","a1","a6","b4"],
   bom:"O jornal é parceiro de uma campanha da própria prefeitura que cobre. O vínculo está escrito na matéria.",pq:"A prova mais forte é o vínculo declarado: “é parceiro da campanha municipal Cidade Limpa”. Repetir o número da prefeitura sem conferir também pesa, mas vale menos aqui."},
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo conferiu o número da economia?",v:"B",ok:"b3",ev:["b3","b1","a3","a4"],
   bom:"A Folha pôs lado a lado o valor do contrato novo e o do antigo, com a fonte de cada um. A economia anunciada não aparece na conta.",pq:"A prova é a comparação de valores com fonte: R$ 31 milhões no contrato novo, R$ 29 milhões no anterior, “segundo o Portal da Transparência”."}],
 fvi:[{tx:"“O documento prevê pagamento de R$ 31 milhões por ano”, conforme o contrato obtido pela reportagem.",c:"fato"},
  {tx:"“A economia virá a partir do segundo ano”, afirma a prefeitura.",c:"versao"},
  {tx:"“A troca mostra uma administração moderna”, na avaliação do consultor.",c:"interp"}],
 fviFb:"O valor no contrato é fato: está no documento. A promessa de economia é versão: relato de quem assinou o contrato. A fala do consultor é interpretação: um juízo sobre o que o fato significa.",
 dif:[{k:"bom1",tx:"O título do Diário repete o anúncio da prefeitura; o da Folha traz o que a prefeitura não anunciou."},
  {k:"x1",tx:"A Folha é mais crítica ao prefeito do que o Diário."},
  {k:"bom2",tx:"A Folha confere o valor em documento; o Diário publica a economia sem conferir."},
  {k:"x2",tx:"O Diário informa quanto lixo a cidade produz; a Folha não."},
  {k:"x3",tx:"Os dois tratam da mesma empresa e do mesmo contrato."}],
 difNo:"“Mais crítica” é impressão, não diferença demonstrável; a quantidade de lixo e o fato de os dois tratarem do mesmo contrato não mudam a leitura. O que muda é de onde vem a informação do título e se o número foi conferido.",
 reflexo:{mec:"Como no Watergate, o que importava não estava no anúncio oficial: estava em documentos que alguém precisou ir buscar. A Folha foi buscar; o Diário ficou com a versão de quem tem interesse nela.",
  tema:"Os dois casos tratam de política e de governantes sob suspeita, o que mostra que a corrupção atravessa as épocas.",
  moral:"Os dois casos provam que a imprensa precisa fiscalizar mais o poder.",
  fb:"É o encontro dos dois atos: nos dois casos a notícia estava em documentos fora do anúncio oficial, e só uma das coberturas foi atrás deles."},
 perg:{q:"Um colega levanta a mão: “E se o contrato for mesmo vantajoso? O Diário não terá informado certo?”",
  certo:"O Diário não informou, repassou: publicou o número de quem tinha interesse nele, sem conferir. Se o contrato for bom, a matéria continua sem apuração.",
  e1:"Sim. Nesse caso o Diário deu a notícia certa, e a Folha criou suspeita à toa.",
  e2:"Ainda não dá para saber, então por enquanto as duas coberturas se equivalem.",
  ok:"Repassar um anúncio não é apurar. A Folha, aliás, não afirmou irregularidade: mostrou documentos e disse o que não encontrou.",
  no:"A resposta que a banca esperava separa resultado de método: o Diário publicou o número da parte interessada sem conferir, e isso não muda se o contrato for bom. A Folha não criou suspeita: mostrou documentos e registrou o que não encontrou."}},

{id:"dewey",nome:"“Dewey derrota Truman” × o desabamento em Campo Belo",
 hist:{nome:"a manchete “Dewey derrota Truman”",ajuda:"Chicago, 1948. Com o fechamento antecipado por causa de uma greve de gráficos, o Chicago Daily Tribune imprimiu a manchete “Dewey derrota Truman” com base nos primeiros resultados e nas pesquisas. Truman venceu a eleição. A foto dele rindo com o jornal na mão virou símbolo da notícia publicada antes do fato.",q:"Que fundamento a manchete do Tribune feriu de forma exemplar?",princ:0,viz:[],
  ok:"Fundamento 1. O Tribune publicou como fato o que era previsão: o caso-escola da notícia sem verificação.",
  vz:"",
  no:"A banca esperava o fundamento 1, veracidade e apuração: o jornal imprimiu como fato um resultado que ainda não existia."},
 intro:"A marquise de um prédio desabou no centro de Campo Belo e matou quatro pessoas. Dois veículos publicaram na mesma noite.",
 A:{v:"Jornal da Serra",t:"Falha de engenheiro causa desabamento que matou quatro",p:[
  "Um erro de cálculo do engenheiro responsável causou o desabamento da marquise do Edifício Aurora, que matou quatro pessoas ontem no centro de Campo Belo.",

  "O engenheiro Paulo Rezende, de 52 anos, assinou a reforma do prédio em 2023.",
  "Moradores disseram que a marquise “já vinha rachando havia meses”.",
  "A reportagem não conseguiu contato com o engenheiro.",
  "O Edifício Aurora tem 12 andares e foi inaugurado em 1978."]},
 B:{v:"Agência Planalto",t:"Marquise desaba e mata quatro; causa será apontada por perícia em 30 dias",p:[
  "A marquise do Edifício Aurora, no centro de Campo Belo, desabou ontem às 17h40 e matou quatro pessoas, segundo o Corpo de Bombeiros.",
  "A causa ainda não é conhecida. A Defesa Civil informou que o laudo da perícia deve sair em 30 dias.",
  "O comandante dos bombeiros, major Luís Arruda, disse que “é cedo para apontar responsáveis”.",
  "Moradores relataram rachaduras; a reportagem viu duas reclamações registradas na prefeitura em março e junho deste ano.",

  "Até as 22h, três das quatro vítimas tinham sido identificadas. Esta reportagem será atualizada."]},
 rodadas:[
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo afirmou mais do que podia provar?",v:"A",ok:"ta",meio:"a2",ev:["ta","a2","a6","a4"],
   bom:"O título crava a causa de um desabamento ocorrido horas antes, sem perícia. É a previsão publicada como fato.",pq:"A prova mais forte é o título, “Falha de engenheiro causa desabamento”. A fonte única e anônima explica por que a afirmação não se sustenta, mas a ferida está no que foi afirmado."},
  {f:3,q:"Fundamento 4, ética e limites. Qual veículo expôs uma pessoa a julgamento antecipado?",v:"A",ok:"a3",meio:"a5",ev:["a3","a5","a4","b5"],
   bom:"Nome, idade e profissão de uma pessoa, ligados a uma causa que ninguém apurou. É a exposição que o fundamento 4 manda evitar.",pq:"A prova é o parágrafo que identifica o engenheiro pelo nome e pela idade logo depois de atribuir a ele o erro. Publicar sem ouvi-lo agrava, mas a exposição está na identificação."},
