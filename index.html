<style>
:root{--ink:#16202c;--ink2:#233144;--paper:#fff;--tint:#eef2f6;--line:#dce3eb;--muted:#5a6a7c;--red:#d94f3d;--teal:#2e8f8a;--amber:#e8a33d;--ok:#1f7a5c;--bad:#b23b2c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tint);color:var(--ink);font:17px/1.55 Calibri,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0 0 .9em}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 14px}
.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.dark .muted{color:#cfd8e3}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red);margin:0 0 .5em}
.dark .kicker{color:var(--amber)}
.muted{color:var(--muted)}.small{font-size:.9rem}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin:0 0 10px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn:focus-visible,.go:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.btn .t{display:inline-block;float:right;margin-left:10px;font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.btn[aria-pressed="true"] .t{color:var(--amber)}
.btn.sem{border-style:dashed}
.go{font:inherit;font-weight:700;color:#fff;background:var(--red);border:0;border-radius:10px;padding:14px 20px;cursor:pointer;width:100%}
.go[disabled]{background:#b9c3ce;cursor:not-allowed}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .clock{font:700 1.15rem/1 Cambria,Georgia,serif;white-space:nowrap}
.bar .lbl{font-size:.78rem;color:#cfd8e3;white-space:nowrap}
.track{flex:1;height:10px;background:#3a4c63;border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--teal);width:0;transition:width .3s}
.fill.over{background:var(--red)}
.mat{border-left:0;background:var(--tint);border-radius:10px;padding:14px;margin:0 0 12px}
.mat h3{margin-bottom:.4em}
.mat p{margin:0 0 .55em}
.mat .n{font-weight:700;color:var(--muted);font-size:.8rem;margin-right:.3em}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--tint);color:var(--ink2);margin:0 6px 6px 0}
.grid8{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.grid8 div{background:var(--tint);border-radius:8px;padding:8px 10px;font-size:.9rem}
.grid8 b{color:var(--red);margin-right:.35em}
.fvi{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.fvi button{flex:1;min-width:92px;margin:0;text-align:center}
.nota{font:700 3.4rem/1 Cambria,Georgia,serif;color:var(--amber)}
.linha{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.linha b{white-space:nowrap}
.dev{border-radius:10px;padding:12px 14px;margin:0 0 10px;background:var(--tint)}
.dev.ok{background:#e6f3ee}.dev.meio{background:#fdf3df}.dev.no{background:#fbe9e6}
.dev strong{display:block;margin-bottom:.2em}
details{margin:0 0 12px}summary{cursor:pointer;font-weight:700}
@media (max-width:480px){h1{font-size:1.6rem}.grid8{grid-template-columns:1fr}.btn .t{float:none;display:block;margin:4px 0 0}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

(function(){

var F=["Veracidade e apuração dos fatos","Responsabilidade social e interesse público","Independência editorial","Ética jornalística e limites da atuação","Liberdade de imprensa e expressão","Jornalismo investigativo","Transparência e prestação de contas","Memória e testemunho"];

/* =====================================================================

var CASOS=[
{id:"escola-base",nome:"Escola Base × a merenda de Santa Rita do Vale",
 hist:{nome:"o caso Escola Base",ajuda:"São Paulo, 1994. A partir de uma denúncia e das declarações de um delegado, jornais e TVs trataram os donos de uma escola infantil como culpados de abuso sexual. O inquérito foi arquivado por falta de provas. A escola já tinha sido depredada e fechada.",q:"Que fundamento o caso Escola Base feriu de forma exemplar?",princ:3,viz:[0],
  ok:"Fundamento 4. A Escola Base é o caso-escola do julgamento prévio: pessoas tratadas como culpadas antes de qualquer prova.",
  vz:"Defensável, mas é o fundamento vizinho. Houve falha de apuração (fonte única, sem checagem), só que a ferida exemplar do caso é o dano a pessoas tratadas como culpadas: fundamento 4.",
  no:"A banca esperava o fundamento 4, ética e limites: julgamento prévio e dano moral. A falha de apuração, fundamento 1, seria a segunda resposta aceitável."},
 intro:"Um vereador protocolou no Ministério Público uma denúncia sobre a compra da merenda escolar de Santa Rita do Vale. Dois veículos da região publicaram no mesmo dia.",
 A:{v:"Gazeta do Vale",t:"Prefeitura superfaturou merenda escolar em R$ 2 milhões",p:[
  "A Prefeitura de Santa Rita do Vale superfaturou em R$ 2 milhões a compra da merenda escolar deste ano.",
  "A informação consta de denúncia protocolada ontem no Ministério Público pelo vereador Dário Lemos (oposição).",
  "Segundo ele, o quilo do frango foi pago a R$ 19,80, “o dobro do preço de mercado”.",
  "O caso expõe o descaso da gestão com as crianças da rede municipal.",
  "A secretária de Educação, Lúcia Paiva, apontada como responsável pelo esquema, não foi localizada até o fechamento desta edição.",
  "A rede municipal atende 14 mil alunos."]},
 B:{v:"Portal Serra Notícias",t:"MP recebe denúncia de sobrepreço na merenda; prefeitura contesta o cálculo",p:[
  "O Ministério Público recebeu ontem uma denúncia de sobrepreço de R$ 2 milhões na compra da merenda escolar de Santa Rita do Vale, protocolada pelo vereador Dário Lemos (oposição).",
  "A reportagem teve acesso à ata do pregão nº 14 e a três notas fiscais: o quilo do frango foi contratado a R$ 19,80.",
  "No mesmo mês, a tabela de preços de referência do governo estadual indicava R$ 12,40 para o mesmo produto.",
  "Em nota, a Secretaria de Educação afirma que o preço inclui entrega diária nas 42 escolas e que a comparação “ignora o frete”.",
  "Para o economista Caio Brandão, da universidade regional, a diferença “é alta demais para ser explicada só pelo frete”.",
  "O MP informou que vai analisar a denúncia em até 30 dias. Ainda não há investigação aberta, e a reportagem não conseguiu confirmar o valor total de R$ 2 milhões, que é uma estimativa do vereador."]},
 rodadas:[
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo apurou melhor?",v:"B",ok:"b2",meio:"b3",ev:["b2","b3","b5","a6"],
   bom:"A ata do pregão e as notas fiscais são o que separa apurar de repassar. O Portal foi ao documento; a Gazeta ficou na denúncia.",pq:"A prova do fundamento 1 está em como o veículo chegou ao dado: “teve acesso à ata do pregão e a três notas fiscais”."},
  {f:3,q:"Fundamento 4, ética e limites. Qual veículo feriu o fundamento de forma mais clara?",v:"A",ok:"ta",ev:["ta","a3","a6","b4"],
   bom:"O título afirma como fato o que é uma denúncia ainda não analisada. É julgamento prévio na parte mais lida da matéria.",pq:"O trecho que prova a ferida é o título da Gazeta: “Prefeitura superfaturou”. A fala do vereador está atribuída corretamente, e os outros trechos não tratam da dignidade de ninguém."},
  {f:6,q:"Fundamento 7, transparência e prestação de contas. Qual veículo foi mais transparente com o leitor?",v:"B",ok:"b6",meio:"b2",ev:["b6","b2","b4","a2"],
   bom:"O Portal diz o que não conseguiu confirmar e de quem é a estimativa. Dizer o que ainda não se sabe é prestar contas.",pq:"A prova mais forte é o parágrafo final do Portal, que admite o que não confirmou. Explicar como soube do preço também é transparência, mas vale menos aqui."}],
 fvi:[{tx:"“O quilo do frango foi contratado a R$ 19,80”, conforme a ata do pregão e três notas fiscais.",c:"fato"},
  {tx:"“O preço inclui entrega diária nas 42 escolas”, segundo nota da Secretaria de Educação.",c:"versao"},
  {tx:"“A diferença é alta demais para ser explicada só pelo frete”, na avaliação do economista.",c:"interp"}],
 fviFb:"O preço na ata é fato: confere-se em documento. A explicação do frete é versão: relato de um envolvido. A avaliação do economista é interpretação: leitura do que o fato significa.",
 dif:[{k:"bom1",tx:"O título da Gazeta afirma o superfaturamento; o do Portal atribui a denúncia e registra a contestação."},
  {k:"x1",tx:"O texto do Portal é mais longo que o da Gazeta."},
  {k:"bom2",tx:"O Portal publica a resposta da Secretaria; a Gazeta diz que não localizou a secretária e a chama de responsável."},
  {k:"x2",tx:"A Gazeta informa quantos alunos a rede tem; o Portal não."},
  {k:"x3",tx:"Os dois citam o mesmo vereador como autor da denúncia."}],
 difNo:"Tamanho do texto, número de alunos e o fato de os dois citarem o mesmo vereador não mudam a leitura. O que muda é o verbo do título e quem foi ouvido.",
 reflexo:{mec:"A Gazeta repete o mecanismo da Escola Base: uma fonte acusadora vira título afirmativo antes de qualquer apuração. O Portal mostra a lição aplicada: atribui, confere em documento, ouve o acusado e diz o que não sabe.",
  tema:"Os dois casos envolvem escolas e crianças, o que mostra que o tema continua atual trinta anos depois.",
  moral:"Os dois casos provam que a imprensa precisa ter mais ética e mais responsabilidade com o que publica.",
  fb:"É o encontro dos dois atos: o mesmo mecanismo, fonte acusadora que vira título afirmativo, aparece nos dois casos, e uma das coberturas mostra a lição aprendida."},
 perg:{q:"Um colega levanta a mão: “E se a denúncia do vereador for verdadeira? A Gazeta não terá acertado?”",
  certo:"Acertar o fato não corrige o método. A Gazeta afirmou o que não tinha como saber naquele dia; se der certo, terá sido sorte, não apuração.",
  e1:"Sim. Se a investigação confirmar, a Gazeta estava certa desde o início e deu o furo.",
  e2:"Ainda não dá para saber, então por enquanto as duas coberturas se equivalem.",
  ok:"Estar certo não é estar justificado. O fundamento 1 trata do método de verificação, não do resultado.",
  no:"A resposta que a banca esperava separa resultado de método: mesmo que a denúncia se confirme, a Gazeta afirmou o que não tinha como saber naquele dia. E as duas coberturas não se equivalem: uma atribui e confere, a outra afirma."}},

{id:"watergate",nome:"Watergate × o contrato do lixo de Porto das Pedras",
 hist:{nome:"o caso Watergate",ajuda:"Washington, 1972. Dois repórteres do Washington Post seguiram por dois anos a pista de um arrombamento na sede do Partido Democrata, contra desmentidos seguidos da Casa Branca. A apuração expôs o envolvimento do governo, e o presidente Richard Nixon renunciou em 1974.",q:"Que fundamento o caso Watergate consagrou de forma exemplar?",princ:5,viz:[2,4],
  ok:"Fundamento 6. Watergate é o caso-escola da investigação que traz à luz o que o poder queria oculto.",
  vz:"Defensável, mas é o fundamento vizinho. O jornal resistiu à pressão do governo, e isso é verdade; só que a lição exemplar do caso é a investigação que expõe abuso de poder: fundamento 6.",
  no:"A banca esperava o fundamento 6, jornalismo investigativo. Independência editorial (3) e liberdade de imprensa (5) seriam respostas vizinhas aceitáveis."},
 intro:"A Prefeitura de Porto das Pedras trocou a empresa que faz a coleta de lixo da cidade. Dois veículos locais publicaram sobre o novo contrato na mesma semana.",
 A:{v:"Diário do Porto",t:"Nova empresa de coleta vai economizar R$ 6 milhões, anuncia prefeitura",p:[
  "A troca da empresa de coleta de lixo vai gerar economia de R$ 6 milhões por ano aos cofres de Porto das Pedras, informou ontem a prefeitura.",
  "O contrato com a Limpa Mais foi assinado na segunda-feira, em cerimônia no gabinete do prefeito Júlio Sarmento.",
  "“É o contrato mais vantajoso da história da cidade”, disse o prefeito.",
  "Para o consultor em gestão pública Ivo Tavares, a troca “mostra uma administração moderna”.",
  "O Diário do Porto é parceiro da campanha municipal Cidade Limpa.",
  "A cidade produz 180 toneladas de lixo por dia."]},
 B:{v:"Folha da Baía",t:"Contrato do lixo foi assinado sem licitação com empresa aberta há quatro meses",p:[
  "A Prefeitura de Porto das Pedras contratou sem licitação a Limpa Mais, empresa aberta há quatro meses, para a coleta de lixo da cidade.",
  "A reportagem obteve o contrato pela Lei de Acesso à Informação e consultou o registro da empresa na Junta Comercial.",
  "O documento prevê pagamento de R$ 31 milhões por ano; o contrato anterior custava R$ 29 milhões, segundo o Portal da Transparência.",
  "A prefeitura afirma que a dispensa de licitação se justifica pela “situação de emergência” e que a economia virá “a partir do segundo ano”.",
  "Um dos sócios da Limpa Mais doou para a campanha do prefeito em 2024, conforme a prestação de contas entregue à Justiça Eleitoral.",
  "Procurado, o sócio não respondeu. A reportagem não encontrou indício de que a doação tenha influenciado a escolha da empresa."]},
 rodadas:[
  {f:5,q:"Fundamento 6, jornalismo investigativo. Qual veículo foi além do que lhe entregaram?",v:"B",ok:"b2",meio:"b5",ev:["b2","b5","b4","a2"],
   bom:"Pedir o contrato pela Lei de Acesso e consultar a Junta Comercial é apuração própria. O Diário trabalhou só com o que a prefeitura anunciou.",pq:"A prova do fundamento 6 está no caminho da apuração: “obteve o contrato pela Lei de Acesso à Informação e consultou o registro da empresa”."},
  {f:2,q:"Fundamento 3, independência editorial. Qual veículo mostra menos autonomia em relação à prefeitura?",v:"A",ok:"a5",meio:"a1",ev:["a5","a1","a6","b4"],
   bom:"O jornal é parceiro de uma campanha da própria prefeitura que cobre. O vínculo está escrito na matéria.",pq:"A prova mais forte é o vínculo declarado: “é parceiro da campanha municipal Cidade Limpa”. Repetir o número da prefeitura sem conferir também pesa, mas vale menos aqui."},
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo conferiu o número da economia?",v:"B",ok:"b3",ev:["b3","b1","a3","a4"],
   bom:"A Folha pôs lado a lado o valor do contrato novo e o do antigo, com a fonte de cada um. A economia anunciada não aparece na conta.",pq:"A prova é a comparação de valores com fonte: R$ 31 milhões no contrato novo, R$ 29 milhões no anterior, “segundo o Portal da Transparência”."}],
 fvi:[{tx:"“O documento prevê pagamento de R$ 31 milhões por ano”, conforme o contrato obtido pela reportagem.",c:"fato"},
  {tx:"“A economia virá a partir do segundo ano”, afirma a prefeitura.",c:"versao"},
  {tx:"“A troca mostra uma administração moderna”, na avaliação do consultor.",c:"interp"}],
 fviFb:"O valor no contrato é fato: está no documento. A promessa de economia é versão: relato de quem assinou o contrato. A fala do consultor é interpretação: um juízo sobre o que o fato significa.",
 dif:[{k:"bom1",tx:"O título do Diário repete o anúncio da prefeitura; o da Folha traz o que a prefeitura não anunciou."},
  {k:"x1",tx:"A Folha é mais crítica ao prefeito do que o Diário."},
  {k:"bom2",tx:"A Folha confere o valor em documento; o Diário publica a economia sem conferir."},
  {k:"x2",tx:"O Diário informa quanto lixo a cidade produz; a Folha não."},
  {k:"x3",tx:"Os dois tratam da mesma empresa e do mesmo contrato."}],
 difNo:"“Mais crítica” é impressão, não diferença demonstrável; a quantidade de lixo e o fato de os dois tratarem do mesmo contrato não mudam a leitura. O que muda é de onde vem a informação do título e se o número foi conferido.",
 reflexo:{mec:"Como no Watergate, o que importava não estava no anúncio oficial: estava em documentos que alguém precisou ir buscar. A Folha foi buscar; o Diário ficou com a versão de quem tem interesse nela.",
  tema:"Os dois casos tratam de política e de governantes sob suspeita, o que mostra que a corrupção atravessa as épocas.",
  moral:"Os dois casos provam que a imprensa precisa fiscalizar mais o poder.",
  fb:"É o encontro dos dois atos: nos dois casos a notícia estava em documentos fora do anúncio oficial, e só uma das coberturas foi atrás deles."},
 perg:{q:"Um colega levanta a mão: “E se o contrato for mesmo vantajoso? O Diário não terá informado certo?”",
  certo:"O Diário não informou, repassou: publicou o número de quem tinha interesse nele, sem conferir. Se o contrato for bom, a matéria continua sem apuração.",

  e2:"Ainda não dá para saber, então por enquanto as duas coberturas se equivalem.",
  ok:"Repassar um anúncio não é apurar. A Folha, aliás, não afirmou irregularidade: mostrou documentos e disse o que não encontrou.",
  no:"A resposta que a banca esperava separa resultado de método: o Diário publicou o número da parte interessada sem conferir, e isso não muda se o contrato for bom. A Folha não criou suspeita: mostrou documentos e registrou o que não encontrou."}},

{id:"boimate",nome:"O boimate × o aplicativo da dengue de Vila Aurora",
 hist:{nome:"o caso boimate",ajuda:"São Paulo, 1983. A revista Veja publicou, na edição de 27 de abril, a matéria “Fruto da carne”: biólogos da Universidade de Hamburgo teriam fundido células de boi e de tomateiro e criado o “boimate”. A fonte era um texto da revista inglesa New Scientist, que era uma brincadeira de 1º de abril. A errata saiu quase um ano depois.",q:"Que fundamento o caso boimate feriu de forma exemplar?",princ:0,viz:[6],
  ok:"Fundamento 1. O boimate é o caso brasileiro mais lembrado da notícia reproduzida sem checar a origem.",
  vz:"Defensável, mas é o fundamento vizinho. A errata demorou quase um ano, e isso é verdade; só que a ferida exemplar do caso é anterior: ninguém conferiu a fonte antes de publicar. Fundamento 1.",
  no:"A banca esperava o fundamento 1, veracidade e apuração: a revista reproduziu uma brincadeira como fato científico. Transparência (7), pela errata tardia, seria a resposta vizinha aceitável."},
 intro:"Uma empresa de Vila Aurora anunciou em comunicado à imprensa um aplicativo que detectaria a dengue por uma foto da pele. Dois veículos publicaram no dia seguinte.",
 A:{v:"Tribuna de Vila Aurora",t:"Aplicativo criado na cidade detecta dengue em dez segundos",p:[
  "Um aplicativo desenvolvido em Vila Aurora detecta a dengue em dez segundos, a partir de uma foto da pele, com 98% de acerto.",
  "O resultado é de um estudo do Instituto Brasileiro de Diagnóstico Digital, divulgado ontem em comunicado à imprensa.",
  "“É uma revolução no combate à doença”, afirma o diretor da empresa DiagFácil, Renan Couto.",
  "O aplicativo já pode ser baixado por R$ 29,90.",
  "A descoberta deve aposentar o exame de sangue nos postos de saúde.",
  "Vila Aurora registrou 3.100 casos de dengue neste ano."]},
 B:{v:"Rádio Planalto Online",t:"Empresa anuncia aplicativo que detectaria dengue; estudo não foi publicado nem registrado",p:[
  "A empresa DiagFácil, de Vila Aurora, anunciou ontem um aplicativo que, segundo ela, detecta a dengue em dez segundos a partir de uma foto da pele.",
  "A reportagem pediu o estudo citado no comunicado. A empresa enviou um resumo de duas páginas, sem autores, sem número de pacientes e sem publicação em revista científica.",
  "O Instituto Brasileiro de Diagnóstico Digital, que assina o comunicado, tem o mesmo endereço e o mesmo CNPJ da DiagFácil, conforme o cadastro da Receita Federal.",
  "Em nota, a empresa diz que os dados completos “serão apresentados em breve” e que o aplicativo “não substitui o médico”.",
  "Para a infectologista Helena Prado, da universidade estadual, “não existe base conhecida para diagnosticar dengue por foto”.",
  "A reportagem não encontrou registro do produto na Anvisa. A Secretaria de Saúde informou que o diagnóstico na rede continua a ser feito por exame de sangue."]},
 rodadas:[
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo conferiu a origem da informação?",v:"B",ok:"b3",meio:"b2",ev:["b3","b2","b5","a2"],
   bom:"Consultar o cadastro e descobrir que o instituto é a própria empresa é checar a fonte da fonte. A Tribuna parou no comunicado.",pq:"A prova mais forte é a checagem da origem: o instituto “tem o mesmo endereço e o mesmo CNPJ” da empresa. Pedir o estudo também é apuração, mas vale menos aqui."},
  {f:1,q:"Fundamento 2, responsabilidade social e interesse público. Qual veículo pode levar o leitor a uma decisão arriscada de saúde?",v:"A",ok:"a5",meio:"a4",ev:["a5","a4","a6","b4"],
   bom:"Dizer que o aplicativo aposenta o exame de sangue é convidar o doente a não procurar o posto. O dano possível está nessa frase.",pq:"A prova mais forte é a previsão sem fonte: “deve aposentar o exame de sangue nos postos de saúde”. Informar o preço ajuda a vender, mas quem põe o leitor em risco é a frase sobre o exame."},
  {f:2,q:"Fundamento 3, independência editorial. Qual veículo funcionou como extensão da divulgação da empresa?",v:"A",ok:"ta",meio:"a4",ev:["ta","a4","a3","b1"],
   bom:"O título assume como fato, sem atribuição, a promessa de quem vende o produto. A voz do jornal e a da empresa viraram uma só.",pq:"A prova mais forte é o título, que afirma o que só a empresa diz: “Aplicativo criado na cidade detecta dengue em dez segundos”. O preço para baixar reforça o tom de anúncio, mas vale menos aqui."}],
 fvi:[{tx:"“O instituto tem o mesmo endereço e o mesmo CNPJ da empresa”, conforme o cadastro da Receita Federal.",c:"fato"},
  {tx:"“Os dados completos serão apresentados em breve”, diz a empresa em nota.",c:"versao"},
  {tx:"“Não existe base conhecida para diagnosticar dengue por foto”, na avaliação da infectologista.",c:"interp"}],
 fviFb:"O endereço e o CNPJ são fato: conferem-se em cadastro público. A promessa de apresentar os dados é versão: relato de uma parte interessada. A fala da infectologista é interpretação: leitura do que se sabe sobre o assunto.",
 dif:[{k:"bom1",tx:"O título da Tribuna afirma que o aplicativo detecta a doença; o da Rádio atribui o anúncio à empresa e diz que o estudo não foi publicado."},
  {k:"x1",tx:"A Tribuna informa o número de casos de dengue na cidade; a Rádio não."},
  {k:"bom2",tx:"A Rádio pediu o estudo e ouviu uma especialista de fora; a Tribuna só reproduz o comunicado e o diretor da empresa."},
  {k:"x2",tx:"Os dois citam a mesma empresa."},
  {k:"x3",tx:"O texto da Rádio é mais longo que o da Tribuna."}],
 difNo:"Número de casos, tamanho do texto e o fato de os dois citarem a mesma empresa não mudam a leitura. O que muda é o que o título afirma e quem foi ouvido além da empresa.",
 reflexo:{mec:"A Tribuna repete o mecanismo do boimate: uma fonte com aparência de ciência é reproduzida sem que ninguém pergunte de onde ela vem. A Rádio mostra a lição aplicada: pede o estudo, confere quem assina e ouve quem entende.",
  tema:"Os dois casos tratam de ciência e tecnologia, o que mostra que o jornalismo científico sempre foi difícil.",
  moral:"Os dois casos provam que a imprensa precisa ter mais cuidado com o que publica.",
  fb:"É o encontro dos dois atos: nos dois casos a aparência de ciência dispensou a checagem da origem, e uma das coberturas mostra o que aparece quando alguém confere."},
 perg:{q:"Um colega levanta a mão: “Mas a Tribuna só reproduziu o que o instituto disse. O erro, se houver, não é do instituto?”",
  certo:"Quem publica responde pelo que publica. A Veja também só reproduziu a New Scientist; conferir a origem era trabalho da redação, não da fonte.",
  e1:"É. O jornal informou a fonte, então a responsabilidade pelo conteúdo é de quem fez o estudo.",
  e2:"Depende: se o aplicativo funcionar, a Tribuna terá acertado e a discussão perde o sentido.",
  ok:"Atribuir não transfere a responsabilidade. Citar a fonte informa de onde veio a notícia; não dispensa conferir se a fonte existe e se merece crédito.",
  no:"A resposta que a banca esperava é que atribuir não transfere a responsabilidade: a Veja também tinha fonte. E o resultado não corrige o método: se o aplicativo funcionar, a Tribuna continuará sem ter apurado."}},

{id:"triplice",nome:"O alarme da vacina tríplice × a água de Ribeirão das Flores",
 hist:{nome:"o caso da vacina tríplice e do estudo de Wakefield",ajuda:"Londres, 1998. A revista médica The Lancet publicou um estudo de Andrew Wakefield, com 12 crianças, que sugeria ligação entre a vacina tríplice viral e o autismo. A imprensa britânica amplificou o alarme por anos. A cobertura vacinal caiu de 91% para 80%, e o sarampo voltou. Uma investigação do repórter Brian Deer, do Sunday Times, expôs a fraude, e o estudo foi retratado em 2010.",q:"Que fundamento a cobertura alarmista do caso feriu de forma exemplar?",princ:1,viz:[0],
  ok:"Fundamento 2. O caso é o exemplo clássico do efeito social da notícia: o alarme amplificado derrubou a vacinação e trouxe a doença de volta.",
  vz:"Defensável, mas é o fundamento vizinho. Faltou apuração, e isso é verdade; só que a ferida exemplar está na consequência para o público: famílias deixaram de vacinar. Fundamento 2.",
  no:"A banca esperava o fundamento 2, responsabilidade social e interesse público: a cobertura teve efeito direto na saúde das pessoas. Veracidade (1) seria a resposta vizinha aceitável."},
 intro:"Um morador de Ribeirão das Flores divulgou nas redes sociais um laudo particular que aponta chumbo na água da torneira de sua casa. Dois veículos publicaram no dia seguinte.",
 A:{v:"Folha do Ribeirão",t:"Água da cidade está contaminada por chumbo, mostra laudo",p:[
  "A água que sai das torneiras de Ribeirão das Flores está contaminada por chumbo, segundo laudo divulgado ontem nas redes sociais pelo morador Élcio Barros.",
  "O laudo, feito por um laboratório particular, analisou uma amostra colhida na casa dele, no bairro Jardim Ipê.",
  "“Estão envenenando a população”, afirmou Barros.",
  "Mercados da cidade registraram corrida por água mineral na tarde de ontem.",
  "A recomendação é não beber água da torneira até segunda ordem.",
  "A companhia de saneamento atende 96 mil moradores."]},
 B:{v:"Portal das Flores",t:"Laudo particular aponta chumbo em uma casa do Jardim Ipê; companhia refaz análise e resultado sai sexta",p:[
  "Um laudo de laboratório particular apontou chumbo acima do limite em uma amostra de água colhida em uma casa do Jardim Ipê, em Ribeirão das Flores.",
  "A reportagem viu o documento: é uma única amostra, colhida pelo próprio morador, de uma torneira ligada a encanamento de 1974.",
  "A companhia de saneamento afirma que as 38 análises da rede feitas neste ano, publicadas em seu site, não detectaram chumbo, e que refez a coleta ontem em dez pontos do bairro. O resultado sai na sexta-feira.",
  "Para a engenheira sanitarista Marta Diniz, da universidade federal, “uma amostra não permite dizer que a rede está contaminada, mas justifica investigar o encanamento da casa e da rua”.",
  "A Vigilância Sanitária informou que não há, até agora, recomendação de suspender o consumo na cidade. Moradores do Jardim Ipê com encanamento antigo podem pedir análise gratuita pelo telefone 156.",
  "A reportagem volta ao assunto na sexta-feira, com o resultado das novas análises."]},
 rodadas:[
  {f:1,q:"Fundamento 2, responsabilidade social e interesse público. Qual veículo deu ao leitor uma orientação sem respaldo de autoridade de saúde?",v:"A",ok:"a5",meio:"ta",ev:["a5","ta","a4","b5"],
   bom:"“Até segunda ordem” de quem? A recomendação não tem autor. É o jornal mandando a cidade parar de beber água por conta própria.",pq:"A prova mais forte é a recomendação sem fonte: “não beber água da torneira até segunda ordem”. O título generaliza para a cidade inteira, e isso pesa, mas a orientação sem autor é a ferida mais clara."},
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo verificou o alcance do laudo?",v:"B",ok:"b2",meio:"b3",ev:["b2","b3","b6","a2"],
   bom:"Uma amostra, colhida pelo próprio morador, em encanamento de 1974: o Portal leu o documento e disse o que ele permite afirmar.",pq:"A prova mais forte é a leitura do laudo: “é uma única amostra, colhida pelo próprio morador”. As análises da companhia também ajudam, mas são a versão de uma parte."},
  {f:6,q:"Fundamento 7, transparência e prestação de contas. Qual veículo disse ao leitor quando e como a dúvida será resolvida?",v:"B",ok:"b6",meio:"b3",ev:["b6","b3","b4","a6"],
   bom:"O Portal assume que a história não acabou e marca data para voltar. É prestar contas do que ainda falta apurar.",pq:"A prova mais forte é o compromisso final: “volta ao assunto na sexta-feira, com o resultado das novas análises”. Informar a data do resultado também ajuda, mas ali quem fala é a companhia."}],
 fvi:[{tx:"“O laudo analisou uma única amostra, de uma casa do Jardim Ipê”, conforme o documento visto pela reportagem.",c:"fato"},
  {tx:"“As 38 análises da rede feitas neste ano não detectaram chumbo”, afirma a companhia de saneamento.",c:"versao"},
  {tx:"“Uma amostra não permite dizer que a rede está contaminada”, na avaliação da engenheira.",c:"interp"}],
 fviFb:"O que consta do laudo é fato: confere-se no documento. O resultado das análises, dito pela companhia, é versão: relato de uma parte interessada. A fala da engenheira é interpretação: leitura do que o fato permite concluir.",
 dif:[{k:"bom1",tx:"O título da Folha fala em água da cidade contaminada; o do Portal fala em uma casa e avisa que há nova análise."},
  {k:"x1",tx:"A Folha informa quantos moradores a companhia atende; o Portal não."},
  {k:"bom2",tx:"O Portal traz a orientação da Vigilância Sanitária; a Folha dá uma recomendação sem dizer de quem é."},
  {k:"x2",tx:"Os dois citam o mesmo laudo."},
  {k:"x3",tx:"O texto do Portal é mais longo que o da Folha."}],
 difNo:"Número de moradores atendidos, tamanho do texto e o fato de os dois citarem o mesmo laudo não mudam a leitura. O que muda é o alcance que o título dá ao laudo e de quem é a orientação ao leitor.",
 reflexo:{mec:"A Folha repete o mecanismo de 1998: um estudo pequeno vira alarme geral, e o alarme muda o comportamento das pessoas antes de qualquer confirmação. O Portal mostra a lição: dizer o tamanho da evidência, ouvir a autoridade de saúde e orientar sem pânico.",
  tema:"Os dois casos tratam de saúde pública, o que mostra que o assunto sempre rendeu notícia.",
  moral:"Os dois casos provam que a imprensa precisa ser mais responsável quando fala de saúde.",
  fb:"É o encontro dos dois atos: nos dois casos uma evidência pequena foi tratada como certeza geral, e a consequência recaiu sobre o comportamento do público."},
 perg:{q:"Um colega levanta a mão: “Mas, na dúvida, não é melhor alarmar? Se houver chumbo, a Folha terá protegido as pessoas.”",
  certo:"Alarme também tem custo: em 1998, a dúvida amplificada derrubou a vacinação. Proteger é dizer o tamanho do risco e o que fazer, como fez o Portal com a análise gratuita.",
  e1:"Sim. Em saúde, é melhor pecar pelo excesso: quem alarma nunca erra.",
  e2:"Não. O jornal só deveria publicar depois do resultado de sexta-feira; antes disso, o certo é o silêncio.",
  ok:"Entre o alarme e o silêncio existe a informação proporcional: o que se sabe, o que não se sabe e o que o leitor pode fazer agora.",
  no:"A resposta que a banca esperava recusa as duas saídas fáceis. Alarmar tem custo, como mostrou a queda da vacinação; calar também, porque o laudo existe e interessa ao bairro. O caminho é a informação proporcional."}},

{id:"times-iraque",nome:"O New York Times e as armas do Iraque × os peixes do rio Claro",
 hist:{nome:"a cobertura do New York Times sobre as armas do Iraque",ajuda:"Nova York, 2002 e 2003. Antes da invasão do Iraque, o New York Times publicou na primeira página reportagens sobre armas de destruição em massa baseadas em fontes do governo americano e em exilados iraquianos interessados na guerra. As armas não existiam. Em 26 de maio de 2004, o jornal publicou uma nota dos editores reconhecendo que a cobertura não tinha sido tão rigorosa quanto deveria.",q:"Que fundamento a cobertura do Times antes da guerra feriu de forma exemplar?",princ:2,viz:[0],
  ok:"Fundamento 3. É o caso-escola da dependência da fonte oficial: o jornal emprestou a própria credibilidade à versão de quem tinha interesse nela.",
  vz:"Defensável, mas é o fundamento vizinho. Faltou verificação, e isso é verdade; só que a raiz da falha foi a proximidade com fontes interessadas, que ninguém na redação contestou. Fundamento 3.",
  no:"A banca esperava o fundamento 3, independência editorial: a cobertura dependeu de fontes do governo e de exilados interessados na guerra. Veracidade (1) seria a resposta vizinha aceitável."},
 intro:"Peixes apareceram mortos no rio Claro, em Três Barras, abaixo da fábrica de celulose Papelsul, a maior empregadora da cidade. Dois veículos publicaram no dia seguinte.",
 A:{v:"Correio de Três Barras",t:"Papelsul descarta relação com morte de peixes e garante que rio está limpo",p:[
  "A Papelsul descartou ontem qualquer relação entre a fábrica e a morte de peixes no rio Claro e garantiu que a água está dentro dos padrões.",
  "Segundo fontes da empresa, a causa provável é a estiagem, que reduziu o oxigênio da água.",
  "“Nosso monitoramento é o mais moderno do país”, disse o gerente de sustentabilidade, Otávio Reis.",
  "A reportagem visitou a estação de tratamento da fábrica a convite da empresa.",
  "A Papelsul emprega 2.300 pessoas e patrocina o caderno Três Barras em Desenvolvimento, deste jornal.",
  "Pescadores estimam em duas toneladas a quantidade de peixes mortos."]},
 B:{v:"Agência Rio Claro",t:"Peixes morrem abaixo da fábrica da Papelsul; órgão ambiental colhe amostras e empresa nega relação",p:[
  "Cerca de duas toneladas de peixes apareceram mortas no rio Claro, em Três Barras, em um trecho de quatro quilômetros abaixo da fábrica da Papelsul, segundo a colônia de pescadores.",
  "O órgão ambiental do estado colheu amostras ontem em três pontos, acima e abaixo da fábrica, e informou que o laudo sai em dez dias.",
  "A Papelsul nega relação com as mortes e atribui o caso à estiagem. A empresa não entregou à reportagem os relatórios de monitoramento do último mês, pedidos por e-mail.",
  "A reportagem consultou os autos de infração do órgão ambiental: a fábrica foi multada duas vezes em 2025 por lançamento de efluente fora do padrão.",
  "Para o biólogo Sandro Leite, da universidade estadual, a estiagem “pode contribuir, mas não explica sozinha mortes concentradas em um trecho”.",
  "A Agência Rio Claro não recebe publicidade da Papelsul. A causa das mortes ainda não é conhecida."]},
 rodadas:[
  {f:2,q:"Fundamento 3, independência editorial. Qual veículo mostra menos autonomia em relação à empresa?",v:"A",ok:"a5",meio:"a4",ev:["a5","a4","a6","b3"],
   bom:"O jornal é patrocinado pela empresa que cobre, e o vínculo está escrito na matéria. A versão da fábrica virou título sem contraponto.",pq:"A prova mais forte é o vínculo declarado: a empresa “patrocina o caderno Três Barras em Desenvolvimento, deste jornal”. A visita a convite também mostra proximidade, mas vale menos aqui."},
  {f:5,q:"Fundamento 6, jornalismo investigativo. Qual veículo foi buscar o que ninguém lhe entregou?",v:"B",ok:"b4",meio:"b3",ev:["b4","b3","b2","a4"],
   bom:"Os autos de infração não vieram em comunicado: alguém foi consultá-los. É a diferença entre receber informação e ir atrás dela.",pq:"A prova mais forte é a consulta aos autos de infração, com as duas multas de 2025. Pedir os relatórios à empresa também é iniciativa, mas o pedido não foi atendido e rendeu menos."},
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo sustentou a causa das mortes em fonte que o leitor não tem como avaliar?",v:"A",ok:"a2",meio:"a1",ev:["a2","a1","a3","b5"],
   bom:"“Fontes da empresa” é anonimato concedido à parte interessada, para dizer o que a empresa já diz em público. O leitor não sabe quem fala nem com que base.",pq:"A prova mais forte é a atribuição: “Segundo fontes da empresa, a causa provável é a estiagem”. O primeiro parágrafo repete a garantia da fábrica, mas ali a fonte ao menos está identificada."}],
 fvi:[{tx:"“A fábrica foi multada duas vezes em 2025”, conforme os autos de infração do órgão ambiental.",c:"fato"},
  {tx:"“A água está dentro dos padrões”, garante a Papelsul.",c:"versao"},
  {tx:"“A estiagem pode contribuir, mas não explica sozinha mortes concentradas em um trecho”, na avaliação do biólogo.",c:"interp"}],
 fviFb:"As multas são fato: constam de documento público. A garantia da empresa é versão: relato de uma parte interessada. A fala do biólogo é interpretação: leitura do que os fatos permitem concluir.",
 dif:[{k:"bom1",tx:"O título do Correio traz a garantia da empresa; o da Agência traz o fato, a coleta de amostras e a negativa."},
  {k:"x1",tx:"O Correio informa quantos empregos a fábrica gera; a Agência não."},
  {k:"bom2",tx:"A Agência consultou documentos e ouviu um especialista de fora; o Correio ouviu só a empresa, em parte sem identificar a fonte."},
  {k:"x2",tx:"Os dois falam em duas toneladas de peixes."},
  {k:"x3",tx:"A Agência é mais dura com a empresa do que o Correio."}],
 difNo:"“Mais dura” é impressão, não diferença demonstrável; o número de empregos e a quantidade de peixes não mudam a leitura. O que muda é de quem é a voz do título e que fontes cada veículo ouviu.",
 reflexo:{mec:"O Correio repete o mecanismo do Times antes da guerra: a versão de uma fonte poderosa e interessada vira notícia sem contraponto, com anonimato de presente. A Agência mostra a lição: registra a versão, mas confere em documento e ouve quem não tem interesse.",
  tema:"Os dois casos envolvem instituições poderosas, o que mostra que o poder sempre tenta influenciar a imprensa.",
  moral:"Os dois casos provam que a imprensa precisa ser mais independente.",
  fb:"É o encontro dos dois atos: nos dois casos a credibilidade do veículo foi emprestada à versão da parte interessada, e uma das coberturas mostra como ouvir a fonte poderosa sem depender dela."},
 perg:{q:"Um colega levanta a mão: “E se o laudo mostrar que foi mesmo a estiagem? O Correio não terá acertado?”",
  certo:"O Correio não apurou, repassou a versão de quem o patrocina. Se o laudo confirmar a estiagem, a empresa terá tido razão; o jornal continuará sem ter verificado nada.",
  e1:"Sim. Nesse caso o Correio informou certo, e a Agência levantou suspeita contra a maior empregadora da cidade.",
  e2:"Ainda não dá para saber, então por enquanto as duas coberturas se equivalem.",
  ok:"Independência não se mede pelo resultado. A Agência, aliás, não acusou: registrou a negativa, mostrou documentos e disse que a causa não é conhecida.",
  no:"A resposta que a banca esperava separa resultado de método: repassar a versão do patrocinador não vira apuração se ela se confirmar. E a Agência não levantou suspeita: publicou a negativa, os documentos e o que ainda não se sabe."}},

{id:"camoes",nome:"Camões no Estadão × a reportagem retirada do ar em Serra Azul",
 hist:{nome:"o caso dos versos de Camões no Estadão",ajuda:"São Paulo, 1972 a 1975. Sob censura prévia, com censores dentro da redação, O Estado de S. Paulo passou a preencher o espaço das matérias vetadas com versos de “Os Lusíadas”, de Camões; o Jornal da Tarde, do mesmo grupo, publicava receitas. Os trechos do poema saíram mais de 600 vezes, até a censura ser retirada, em janeiro de 1975. O leitor não sabia o que tinha sido cortado, mas sabia que algo tinha sido.",q:"Que fundamento a resposta do jornal à censura consagrou?",princ:4,viz:[6,7],
  ok:"Fundamento 5. Os versos de Camões são o símbolo brasileiro da resistência à censura: o jornal não pôde publicar, mas não fingiu normalidade.",
  vz:"Defensável, mas é o fundamento vizinho. Avisar o leitor do corte e deixar o registro para a história fazem parte do gesto; só que a lição exemplar é a defesa da liberdade de publicar. Fundamento 5.",
  no:"A banca esperava o fundamento 5, liberdade de imprensa e expressão. Transparência (7) e memória (8) seriam respostas vizinhas aceitáveis."},
 intro:"Um juiz de Serra Azul mandou dois veículos retirarem do ar reportagens sobre o loteamento Recanto das Águas, a pedido do empresário responsável. Estas são as páginas que cada um pôs no lugar.",
 A:{v:"Diário de Serra Azul",t:"Nota aos leitores",p:[
  "A reportagem publicada no dia 3 sobre o loteamento Recanto das Águas não está mais disponível.",
  "O Diário de Serra Azul não comentará o assunto.",
  "O loteamento Recanto das Águas tem 420 lotes e fica na zona norte da cidade.",
  "O empresário Nélson Quadros, responsável pelo empreendimento, afirma que todas as licenças estão em dia.",
  "“Fui vítima de uma campanha”, disse Quadros.",
  "O Diário reafirma seu compromisso com a verdade."]},
 B:{v:"Jornal do Planalto",t:"Justiça manda retirar do ar reportagem sobre loteamento; jornal cumpre e recorre",p:[
  "O Jornal do Planalto retirou do ar ontem, por ordem judicial, a reportagem sobre o loteamento Recanto das Águas publicada no dia 3.",
  "A liminar foi concedida pelo juiz da 2ª Vara Cível de Serra Azul a pedido do empresário Nélson Quadros, responsável pelo empreendimento, que alega dano à imagem. A multa por descumprimento é de R$ 10 mil por dia.",
  "A decisão, que é pública, pode ser lida na íntegra neste link, com o número do processo.",
  "O jornal cumpriu a ordem e recorreu ao Tribunal de Justiça. A reportagem se baseou em documentos da prefeitura e ouviu o empresário antes da publicação.",
  "Para a advogada Cecília Rocha, especialista em direito constitucional, a retirada de conteúdo antes do julgamento “é medida extrema, que os tribunais superiores costumam rever”.",
  "Procurada, a defesa de Quadros afirmou que a reportagem “tinha erros” e que não comenta processo em andamento. Este texto será atualizado quando o recurso for julgado."]},
 rodadas:[
  {f:4,q:"Fundamento 5, liberdade de imprensa e expressão. Qual veículo defendeu o direito de publicar?",v:"B",ok:"b4",meio:"b5",ev:["b4","b5","b2","a6"],
   bom:"Cumprir a ordem e recorrer é a defesa possível dentro da lei: o jornal obedece, mas não aceita o silêncio como ponto final.",pq:"A prova mais forte é a atitude do jornal: “cumpriu a ordem e recorreu ao Tribunal de Justiça”. A avaliação da advogada reforça, mas é a voz de outra pessoa, não o ato do veículo."},
  {f:6,q:"Fundamento 7, transparência e prestação de contas. Qual veículo escondeu do leitor o motivo do sumiço da reportagem?",v:"A",ok:"a2",meio:"a1",ev:["a2","a1","a6","b6"],
   bom:"“Não comentará o assunto” fecha a porta para quem quer saber por que a matéria sumiu. O leitor fica sem o texto e sem a explicação.",pq:"A prova mais forte é a recusa: “não comentará o assunto”. Dizer que a reportagem “não está mais disponível” já esconde a causa, mas é a recusa que confirma o silêncio."},
  {f:7,q:"Fundamento 8, memória e testemunho. Qual veículo deixou registro do que aconteceu para quem pesquisar depois?",v:"B",ok:"b3",meio:"b1",ev:["b3","b1","b6","a3"],
   bom:"Com a decisão na íntegra e o número do processo, o episódio fica documentado. Quem pesquisar daqui a dez anos saberá que houve uma ordem e de quem.",pq:"A prova mais forte é o documento: a decisão “pode ser lida na íntegra neste link, com o número do processo”. Registrar a data da retirada também ajuda, mas vale menos sem o documento."}],

{id:"cbs-documentos",nome:"Os documentos da CBS × a planilha do asfalto de Lagoa Nova",
 hist:{nome:"o caso dos documentos da CBS",ajuda:"Nova York, 2004. A dois meses da eleição, o programa 60 Minutes, da CBS, exibiu documentos sobre o serviço militar do presidente George W. Bush sem conseguir autenticá-los. A emissora defendeu a reportagem por 12 dias, depois admitiu que não podia garantir a autenticidade. Um painel independente publicou um relatório de 224 páginas, e quatro profissionais foram afastados.",q:"Que fundamento o caso tornou exemplar, da reportagem ao desfecho?",princ:6,viz:[0],
  ok:"Fundamento 7. O caso mostra as duas pontas: a reportagem não disse ao público o que não tinha conseguido autenticar, e o desfecho foi um relatório externo publicado na íntegra.",
  vz:"Defensável, mas é o fundamento vizinho. A verificação falhou, e isso é verdade; só que o caso ficou exemplar pelo que o público não soube sobre o método e pelo relatório que depois abriu tudo. Fundamento 7.",
  no:"A banca esperava o fundamento 7, transparência e prestação de contas: a emissora garantiu o que não podia e depois submeteu o próprio trabalho a um painel independente. Veracidade (1) seria a resposta vizinha aceitável."},
 intro:"Uma planilha atribuída à Secretaria de Obras de Lagoa Nova, com ruas a asfaltar e nomes de vereadores, chegou a duas redações na mesma semana. As duas publicaram.",
 A:{v:"Gazeta de Lagoa Nova",t:"Exclusivo: planilha secreta revela asfalto em troca de votos na Câmara",p:[
  "Uma planilha secreta da Secretaria de Obras, obtida com exclusividade pela Gazeta, revela que a prefeitura distribuiu asfalto em troca de votos na Câmara.",
  "O documento lista 14 ruas e, ao lado de cada uma, o nome de um vereador.",
  "Especialistas consultados pela Gazeta confirmaram a autenticidade do material.",
  "“Isso é compra de voto com dinheiro público”, disse o vereador Tales Moura (oposição).",
  "A prefeitura não quis se manifestar.",
  "Lagoa Nova tem 212 quilômetros de ruas sem pavimento."]},
 B:{v:"Portal Lagoa",t:"Planilha atribuída à Secretaria de Obras liga ruas asfaltadas a vereadores; prefeitura não reconhece o documento",p:[
  "Uma planilha atribuída à Secretaria de Obras de Lagoa Nova lista 14 ruas e, ao lado de cada uma, o nome de um vereador.",
  "O Portal recebeu o arquivo de uma fonte que pediu anonimato por medo de represália. A fonte trabalha na prefeitura; a reportagem confirmou o vínculo, mas não a autoria da planilha.",
  "Como o documento foi checado: 11 das 14 ruas aparecem em ordens de serviço publicadas no Diário Oficial entre março e junho, e os dados internos do arquivo indicam que ele foi criado em fevereiro. Esses dados podem ser alterados e não bastam como prova.",
  "Em nota, a prefeitura afirma que “não reconhece o documento” e que a ordem das obras segue critérios técnicos.",
  "Para o cientista político Davi Lins, da universidade federal, a coincidência com as ordens de serviço “é um indício que merece investigação, não uma prova de troca de votos”.",
  "O que o Portal não conseguiu confirmar: quem fez a planilha e o que significam os nomes ao lado das ruas."]},
 rodadas:[
  {f:6,q:"Fundamento 7, transparência e prestação de contas. Qual veículo mostrou ao leitor como checou o documento?",v:"B",ok:"b3",meio:"b6",ev:["b3","b6","b2","a3"],
   bom:"O Portal abre o método: o que bateu e o que não basta como prova. O leitor pode refazer o caminho e discordar.",pq:"A prova mais forte é o parágrafo do método, que começa com “Como o documento foi checado”. Dizer o que não foi confirmado também é transparência, mas vale menos sem o como."},
  {f:0,q:"Fundamento 1, veracidade e apuração. Qual veículo afirmou mais do que o documento permite?",v:"A",ok:"ta",meio:"a1",ev:["ta","a1","a2","b1"],
   bom:"Uma lista de ruas com nomes ao lado não diz, sozinha, que houve troca de votos. O título tirou do documento o que ele não contém.",pq:"A prova mais forte é o título: “planilha secreta revela asfalto em troca de votos”. O primeiro parágrafo repete a afirmação, mas é no título que ela chega a mais gente."},
  {f:3,q:"Fundamento 4, ética e limites. Qual veículo explicou ao leitor por que protegeu a identidade da fonte?",v:"B",ok:"b2",ev:["b2","b6","a1","a3"],

 fvi:[{tx:"“Onze das 14 ruas aparecem em ordens de serviço”, conforme o Diário Oficial.",c:"fato"},

 dif:[{k:"bom1",tx:"O título da Gazeta afirma a troca de votos; o do Portal descreve o documento e registra que a prefeitura não o reconhece."},

 reflexo:{mec:"A Gazeta repete o mecanismo da CBS: apresenta como autêntico um documento sem dizer como o verificou e apoia a garantia em especialistas sem nome. O Portal mostra a lição: abre o método e separa o que confirmou do que não confirmou.",

  moral:"Os dois casos provam que a imprensa precisa ser mais transparente.",

  certo:"Não. Dizer o limite da checagem é o que permite confiar no resto. A CBS garantiu o que não podia e, quando o método veio a público, perdeu a reportagem inteira.",
  e1:"Enfraquece. O leitor quer certeza; a Gazeta foi mais firme e, por isso, mais convincente.",
  e2:"Enfraquece. Se não confirmou a autoria, o Portal não deveria ter publicado nada.",

  no:"A resposta que a banca esperava é que admitir o limite sustenta a confiança, em vez de reduzi-la. Firmeza sem método foi o erro da CBS. E a parte confirmada, a coincidência com as ordens de serviço, tem interesse público suficiente para ser publicada."}},

{id:"hiroshima",nome:"“Hiroshima”, de John Hersey × um ano da enchente do Beira-Rio",
 hist:{nome:"a reportagem “Hiroshima”",ajuda:"Nova York, 1946. Um ano depois da bomba atômica, a revista The New Yorker dedicou a edição inteira de 31 de agosto a uma única reportagem, “Hiroshima”, de John Hersey. Em 31 mil palavras, ele contou a explosão pela experiência de seis sobreviventes. Até ali, o público conhecia a bomba por números e pela imagem do cogumelo.",q:"Que fundamento a reportagem de Hersey consagrou de forma exemplar?",princ:7,viz:[1],
  ok:"Fundamento 8. “Hiroshima” é o caso-escola do jornalismo como testemunho: deu rosto e voz ao que só existia como estatística e fixou a memória do fato.",
  vz:"Defensável, mas é o fundamento vizinho. A reportagem tinha enorme interesse público; só que a lição exemplar está na forma: o registro do testemunho de quem viveu. Fundamento 8.",
  no:"A banca esperava o fundamento 8, memória e testemunho: a reportagem registrou a experiência de quem viveu o fato. Responsabilidade social (2) seria a resposta vizinha aceitável."},
 intro:"A enchente que destruiu o bairro Beira-Rio, em São Gonçalo da Mata, completou um ano. Dois veículos publicaram sobre a data.",
 A:{v:"Diário da Mata",t:"Um ano depois da enchente, prefeitura diz que 90% das obras estão concluídas",p:[
  "Um ano depois da enchente que atingiu o bairro Beira-Rio, a prefeitura informou ontem que 90% das obras de reconstrução estão concluídas.",
  "Foram investidos R$ 48 milhões, segundo a Secretaria de Obras.",
  "A enchente deixou 9 mortos e 1.400 desabrigados.",
  "“A cidade virou a página”, afirmou a prefeita Sônia Vidal em cerimônia no ginásio municipal.",
  "Moradores participaram do evento.",
  "O nível do rio é hoje monitorado por três sensores."]},
 B:{v:"Revista Margem",t:"“A água levou até as fotografias”: um ano depois, seis moradores do Beira-Rio contam o que foi e o que ficou",p:[
  "Na noite de 14 de março, a auxiliar de enfermagem Dalva Nunes, de 58 anos, pôs a mãe em cima do guarda-roupa e esperou seis horas pelo barco dos bombeiros. “A água levou até as fotografias. Não tenho mais como mostrar aos netos o rosto do meu pai”, diz.",
  "A reportagem ouviu seis moradores do Beira-Rio ao longo de três semanas e voltou com eles aos endereços onde moravam.",
  "Dos 1.400 desabrigados, 310 ainda vivem em casas alugadas com auxílio da prefeitura, segundo a Secretaria de Assistência Social.",
  "A prefeitura afirma que 90% das obras estão concluídas. O percentual se refere a pontes e ruas; das 220 casas prometidas, 64 foram entregues, conforme o cronograma publicado no site da própria prefeitura.",
  "Os nomes dos nove mortos estão listados no fim deste texto, com a idade e a rua de cada um.",
  "As entrevistas gravadas foram doadas, com autorização dos moradores, ao arquivo público municipal."]},
 rodadas:[
  {f:7,q:"Fundamento 8, memória e testemunho. Qual veículo registrou a experiência de quem viveu o fato?",v:"B",ok:"b1",meio:"b5",ev:["b1","b5","b3","a5"],
   bom:"O relato de Dalva faz o que nenhum número faz: mostra o que é perder a casa a quem não estava lá. É o testemunho como registro.",pq:"A prova mais forte é a voz de quem viveu: “A água levou até as fotografias”. A lista dos mortos também é memória, mas o fundamento pede o testemunho, e ele está no primeiro parágrafo."},

  {f:2,q:"Fundamento 3, independência editorial. Qual veículo contou o aniversário pela agenda da prefeitura?",v:"A",ok:"a4",meio:"ta",ev:["a4","ta","a6","b4"],

 fvi:[{tx:"“Das 220 casas prometidas, 64 foram entregues”, conforme o cronograma publicado pela prefeitura.",c:"fato"},
  {tx:"“Esperei seis horas pelo barco dos bombeiros”, conta a moradora.",c:"versao"},
  {tx:"“A cidade virou a página”, na avaliação da prefeita.",c:"interp"}],
 fviFb:"As casas entregues são fato: conferem-se no cronograma. O relato da moradora é versão: o testemunho de quem viveu, valioso e ainda assim um ponto de vista. A frase da prefeita é interpretação: um juízo sobre o que os fatos significam.",
 dif:[{k:"bom1",tx:"O título do Diário parte do balanço da prefeitura; o da Revista parte da voz de quem perdeu a casa."},
  {k:"x1",tx:"O Diário informa quantos sensores monitoram o rio; a Revista não."},

 reflexo:{mec:"A Revista faz o que Hersey fez em 1946: troca o balanço em números pela experiência de pessoas com nome, e assim registra o que a estatística apaga. O Diário fica com a contabilidade oficial, e quem viveu a enchente aparece só como plateia de cerimônia.",

var KEY="ensaio-geral:vistos",S,C;
function vistos(){try{var v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[];}catch(e){return[];}}
function sortear(evitar){var v=vistos(),livres=CASOS.filter(function(c){return v.indexOf(c.id)<0&&c.id!==evitar;});
 if(!livres.length){v=[];livres=CASOS.filter(function(c){return c.id!==evitar;});}
 var c=livres[Math.floor(Math.random()*livres.length)];v.push(c.id);try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}return c;}
function inv(k){if(k==="ta")return "tb";if(k==="tb")return "ta";return (k.charAt(0)==="a"?"b":"a")+k.slice(1);}
/* A cada ensaio, o caso é copiado e embaralhado: a ordem das duas matérias e a dos três julgamentos mudam. */
function prep(c){var x=JSON.parse(JSON.stringify(c)),i,j,t;
 if(Math.random()<.5){t=x.A;x.A=x.B;x.B=t;x.rodadas.forEach(function(g){g.v=g.v==="A"?"B":"A";g.ok=inv(g.ok);if(g.meio)g.meio=inv(g.meio);g.ev=g.ev.map(inv);});}
 for(i=x.rodadas.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=x.rodadas[i];x.rodadas[i]=x.rodadas[j];x.rodadas[j]=t;}
 return x;}
function original(id){for(var i=0;i<CASOS.length;i++)if(CASOS[i].id===id)return CASOS[i];return CASOS[0];}
function novo(caso){C=prep(caso);S={i:-1,r:{},fim:false,ord:{}};}
function ord(id,l){if(!S.ord[id]){var a=l.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}S.ord[id]=a;}return S.ord[id];}
function trecho(k){if(k==="ta")return "Título: “"+C.A.t+"” ("+C.A.v+")";if(k==="tb")return "Título: “"+C.B.t+"” ("+C.B.v+")";
 var m=k.charAt(0)==="a"?C.A:C.B;return "“"+m.p[Number(k.charAt(1))-1]+"” ("+m.v+")";}
var RESUMO=[{k:"longo",s:270,tx:"Contar a história inteira, em ordem, com todos os personagens e detalhes."},
 {k:"licao",s:160,tx:"Resumir em três movimentos: o que aconteceu, como a imprensa agiu e o que ficou de lição."},
 {k:"nome",s:50,tx:"Só citar o caso, que todo mundo conhece, e ir logo para as matérias atuais."}];
var FALAS=[{k:"um",tx:"Quem fala melhor apresenta tudo; os outros ficam de apoio."},
 {k:"todos",tx:"Cada ato fica com integrantes diferentes, e os cinco falam."},
 {k:"slides",tx:"Uma pessoa apresenta, outra passa os slides, as demais respondem perguntas se houver."}];
var TR={mec:160,tema:90,moral:120};
var PASSOS=["falas","resumo","fund","ler","r0","r1","r2","fvi","dif","reflexo","perg"];
function mmss(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
function achar(l,k){for(var i=0;i<l.length;i++)if(l[i].k===k)return l[i];}
function tempo(){var t=0,r=S.r;
 if(r.resumo)t+=achar(RESUMO,r.resumo).s;
 [0,1,2].forEach(function(n){var x=r["r"+n];if(x&&x.ev)t+=x.ev==="sem"?50:90;});
 if(r.fvi&&Object.keys(r.fvi).length===3)t+=30;
 if(r.dif)t+=30*r.dif.length;
 if(r.reflexo)t+=TR[r.reflexo];
 return t;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var app=document.getElementById("app"),bar=document.getElementById("bar");
function relogio(){var t=tempo();document.getElementById("clock").textContent=mmss(t);
 var f=document.getElementById("fill");f.style.width=Math.min(100,t/LIM*100)+"%";f.className="fill"+(t>LIM?" over":"");}
function materia(m){var h='<div class="mat"><p class="kicker" style="color:var(--muted)">'+esc(m.v)+'</p><h3>'+esc(m.t)+'</h3>';
 m.p.forEach(function(p,i){h+='<p><span class="n">'+(i+1)+'</span>'+esc(p)+'</p>';});return h+'</div>';}
function materias(){return '<details><summary>As duas matérias</summary>'+materia(C.A)+materia(C.B)+'</details>';}
function botoes(lista,sel,nome){return lista.map(function(o){var on=Array.isArray(sel)?sel.indexOf(o.k)>=0:sel===o.k;
 return '<button class="btn'+(o.k==="sem"?" sem":"")+'" data-'+nome+'="'+o.k+'" aria-pressed="'+on+'">'+(o.s?'<span class="t">'+mmss(o.s)+'</span>':'')+esc(o.tx)+'</button>';}).join("");}

function capa(){bar.hidden=true;

function banca(){var r=S.r,d=[],regua=0,comp=0,art=0,clar=0,part=0,t=tempo();
 function v(x){return String(Math.round(x*100)/100).replace(".",",");}
 function add(c,t1,t2){d.push('<div class="dev '+c+'"><strong>'+t1+'</strong>'+esc(t2)+'</div>');}
 C.rodadas.forEach(function(g,n){var x=r["r"+n],nome="Julgamento "+(n+1)+", fundamento "+(g.f+1);
  if(x.ev==="sem"){add("no",nome+": 0 de 1,2","O grupo deu o veredicto sem projetar trecho. Pela regra de ouro, não pontua, mesmo que o veredicto esteja certo. Os 40 segundos economizados custaram o julgamento inteiro.");return;}
  var p=0,tx;if(x.v===g.v)p+=.4;
  if(x.v===g.v&&x.ev===g.ok){p+=.8;tx=g.bom;}
  else if(x.v===g.v&&g.meio&&x.ev===g.meio){p+=.4;tx="O trecho ajuda, mas não é o mais forte. "+g.pq;}
  else if(x.v===g.v){tx="Veredicto certo, prova errada. O trecho escolhido é verdadeiro, mas não sustenta o que o grupo afirmou. "+g.pq;}
  else{tx="A banca discordou do veredicto, e a citação não o salvou. "+g.pq;}
  regua+=p;add(p>=1.2?"ok":p>0?"meio":"no",nome+": "+v(p)+" de 1,2",tx);});
 var ac=0;C.fvi.forEach(function(s,i){if(r.fvi[i]===s.c)ac++;});
 var pf=ac===3?.4:ac===2?.2:0;regua+=pf;
 add(ac===3?"ok":ac===2?"meio":"no","Fato, versão, interpretação: "+v(pf)+" de 0,4","Você acertou "+ac+" de 3. "+C.fviFb);
 var bons=r.dif.filter(function(k){return k.indexOf("bom")===0;}).length;comp=bons;
 add(bons===2?"ok":bons===1?"meio":"no","Qualidade da comparação: "+comp+" de 2,0",bons===2?"As duas diferenças escolhidas mudam o que o leitor entende do fato.":"A rubrica pede diferenças relevantes, não cosméticas. "+C.difNo);
 var f1=Number(r.fund),H=C.hist,pa=f1===H.princ?1:H.viz.indexOf(f1)>=0?.5:0;
 var txa=f1===H.princ?H.ok:H.viz.indexOf(f1)>=0?H.vz:H.no;
 if(r.resumo==="nome"){pa=pa/2;txa+=" E como o grupo só citou o nome do caso, a lição não foi construída diante da plateia: vale metade.";}
 var pr=r.reflexo==="mec"?1:r.reflexo==="tema"?.25:0;
 if(r.resumo==="nome"&&pr>.5)pr=.5;
 art=pa+pr;
 add(pa>=1?"ok":pa>0?"meio":"no","Ato 1, a lição do espelho: "+v(pa)+" de 1,0",txa);
 add(pr>=1?"ok":pr>0?"meio":"no","Ato 3, o reflexo: "+v(pr)+" de 1,0",r.reflexo==="mec"?(r.resumo==="nome"?"A ligação é a certa, mas chegou sem base: o Ato 1 não explicou o caso histórico, então o reflexo ficou pela metade.":C.reflexo.fb):r.reflexo==="tema"?"Coincidência de tema não é reflexo. A pergunta do Ato 3 é o que o caso antigo ensina a ver nas matérias de hoje, e a resposta está no mecanismo, não no assunto.":"Conclusão moral serve para qualquer par de casos, portanto não articula estes dois. A banca queria o mecanismo que se repete e o trecho que o mostra.");
 var pt=t<=LIM?.5:t<=LIM+60?.25:0,pq=r.perg==="certo"?.5:0;clar=pt+pq;
 add(pt>=.5?"ok":pt>0?"meio":"no","Gestão do tempo: "+v(pt)+" de 0,5","O grupo usou "+mmss(t)+" de 12:00."+(t>LIM?" Estourar o tempo desconta."+(r.resumo==="longo"?" O Ato 1 levou 4:30 para uma meta de 3: contar a história inteira é o jeito mais comum de perder o Ato 3.":""):" Coube.")+(t<540?" Sobrou muito tempo: provavelmente faltou evidência projetada ou espelho histórico.":""));
 add(pq?"ok":"no","Domínio do conteúdo, na pergunta: "+v(pq)+" de 0,5",pq?C.perg.ok:C.perg.no);
 part=r.falas==="todos"?1:r.falas==="slides"?.3:0;
 add(part>=1?"ok":part>0?"meio":"no","Participação equilibrada: "+v(part)+" de 1,0",part>=1?"Os cinco falaram, um ato para cada parte do grupo.":"A rubrica pede participação equilibrada de todos os integrantes. Passar slide não é apresentar.");
 var total=regua+comp+art+clar+part;bar.hidden=true;
 return '<div class="card dark"><p class="kicker">A banca devolve</p><div class="nota">'+v(total)+'</div><p>de 10 pontos, em '+mmss(t)+' de apresentação.</p><p class="muted small">Caso: '+esc(C.nome)+'</p></div>'+
 '<div class="card"><h2>A rubrica</h2>'+[["Régua dos 8 fundamentos, com evidência textual",regua,4],["Qualidade da comparação",comp,2],["Articulação entre o caso histórico e o atual",art,2],["Clareza, domínio do conteúdo e tempo",clar,1],["Participação equilibrada",part,1]].map(function(l){return '<div class="linha"><span>'+l[0]+'</span><b>'+v(l[1])+' de '+l[2]+',0</b></div>';}).join("")+'</div>'+
 '<div class="card"><h2>Decisão por decisão</h2>'+d.join("")+'</div>'+
 '<div class="card"><h2>Para a apresentação de verdade</h2><p>Ensaiem com cronômetro. O caso histórico entra como lição em três minutos, não como aula de história. Todo julgamento vai para a tela com o trecho que o prova, legível do fundo da sala. Escolham diferenças que mudam a leitura do fato. E fechem mostrando o mecanismo que se repete entre o caso antigo e o de hoje.</p></div>'+
 '<button class="go" data-outro="1">Ensaiar com outro caso</button><p style="margin-top:10px"><button class="go ghost" data-repetir="1">Repetir este caso</button></p>'+
 '<p class="small muted" style="margin-top:14px">Ensaio Geral, jogo de treino da disciplina Fundamentos de Jornalismo (PUC-Campinas, 2026/2), do Prof. Artur Araujo. Os casos históricos são reais. As matérias atuais, as cidades, os veículos e todas as pessoas citadas nelas são fictícios.</p>';}

novo(sortear(null));render();
